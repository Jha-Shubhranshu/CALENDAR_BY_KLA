<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 320px;
      background: #0f0f0f;
      color: #e8e8e8;
      font-size: 13px;
    }

    header {
      background: #1a1a1a;
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    header span { font-size: 10px; color: #666; }

    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    .field-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #555;
      letter-spacing: .5px;
      margin-bottom: 4px;
    }

    .email-row { display: flex; gap: 6px; align-items: center; }
    select#email-select {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
    }
    select#email-select:focus { border-color: #cc785c; }

    .meta-row span {
      font-size: 12px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-ok   { background: #1a3a1a; color: #5cdb5c; }
    .badge-err  { background: #3a1a1a; color: #db5c5c; }
    .badge-warn { background: #3a2e1a; color: #dba95c; }

    .action-row { display: flex; gap: 8px; }

    button#save {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #cc785c;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button#save:hover:not(:disabled) { background: #b5664c; }
    button#save:disabled { background: #333; color: #666; cursor: not-allowed; }

    button#download {
      padding: 10px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #1a1a1a;
      color: #ccc;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button#download:hover:not(:disabled) { background: #232323; border-color: #3a3a3a; color: #fff; }
    button#download:disabled { background: #161616; color: #555; border-color: #222; cursor: not-allowed; }

    #status { font-size: 12px; min-height: 18px; text-align: center; }

    details { border-top: 1px solid #222; padding-top: 12px; }
    summary { font-size: 11px; color: #555; cursor: pointer; user-select: none; }
    summary:hover { color: #888; }

    .settings-body { margin-top: 12px; display: flex; flex-direction: column; gap: 14px; }
    .setting-group { display: flex; flex-direction: column; gap: 6px; }

    .setting-group input[type="text"],
    .setting-group input[type="password"],
    .setting-group input[type="email"] {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      width: 100%;
    }
    .setting-group input:focus { border-color: #cc785c; }

    .row { display: flex; gap: 6px; }
    .row input { flex: 1; }

    .btn-sm {
      padding: 5px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sm:hover { background: #1a1a1a; color: #eee; }
    .btn-sm.primary { background: #cc785c22; border-color: #cc785c55; color: #cc785c; }
    .btn-sm.primary:hover { background: #cc785c44; }

    #email-list { display: flex; flex-direction: column; gap: 4px; }
    .email-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      color: #aaa;
    }
    .email-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .email-chip button {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 0 0 8px;
      flex-shrink: 0;
    }
    .email-chip button:hover { color: #db5c5c; }

    .divider { border: none; border-top: 1px solid #1e1e1e; }
  </style>
</head>
<body>
  <header>
    <h1>Convo Saver</h1>
    <span>claude.ai</span>
  </header>

  <div class="body">

    <div>
      <div class="field-label">Account Email</div>
      <div class="email-row">
        <select id="email-select">
          <option value="">— select or add in settings —</option>
        </select>
      </div>
    </div>

    <div class="meta-row">
      <div class="field-label">Conversation</div>
      <span id="title">—</span>
    </div>
    <div class="meta-row">
      <div class="field-label">Messages</div>
      <span id="msg-count">—</span>
    </div>

    <div class="action-row">
      <button id="save" disabled>Save Conversation</button>
      <button id="download" disabled title="Download as JSON file">⬇</button>
    </div>
    <div id="status"></div>

    <details>
      <summary>⚙ Settings</summary>
      <div class="settings-body">

        <div class="setting-group">
          <div class="field-label">API Endpoint</div>
          <input id="cfg-endpoint" type="text" placeholder="https://your-api.com/conversations" />
        </div>
        <div class="setting-group">
          <div class="field-label">API Key</div>
          <input id="cfg-key" type="password" placeholder="sk-…" />
        </div>
        <button class="btn-sm primary" id="save-api-settings">Save API settings</button>

        <hr class="divider" />

        <div class="setting-group">
          <div class="field-label">Saved Emails</div>
          <div id="email-list">
            <span style="font-size:11px;color:#444;">No emails saved yet.</span>
          </div>
        </div>
        <div class="setting-group">
          <div class="field-label">Add Email Manually</div>
          <div class="row">
            <input id="new-email-input" type="email" placeholder="you@example.com" />
            <button class="btn-sm" id="add-email-btn">Add</button>
          </div>
        </div>

      </div>
    </details>

  </div>

  <script src="popup.js"></script>
</body>
</html>
