name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cal_TS_Frontend   # <-- frontend lives here now
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Cal_TS_Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://dtdjg3wim5ilk.cloudfront.net

  # OPTIONAL backend CI. Your backend is Python (you have .venv / alembic / *.py),
  # so this is a Python job, not npm. Uncomment and adjust to your actual
  # dependency file and test command. Left commented so it can't fail a build
  # before you've wired it up.
