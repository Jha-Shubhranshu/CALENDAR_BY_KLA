name: Deploy Backend to AWS

on:
  push:
    branches: [master]
    # Your backend isn't contained in one folder (Dockerfile + alembic + .py files
    # live at the repo root, alongside Cal_Backend). So instead of listing backend
    # paths, we deploy on ANY push to master EXCEPT pure frontend / infra / docs changes.
    paths-ignore:
      - "Cal_TS_Frontend/**"
      - "terraform/**"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/workflows/ci.yml"
      - "**/*.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: calendar-by-kla-backend
  LAMBDA_FUNCTION_NAME: calendar-by-kla-backend
  ROLE_ARN: arn:aws:iam::099210689603:role/github-actions-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        # NO working-directory: your Dockerfile is at the repo ROOT, so we build
        # from root. The build context is the whole repo (the root .dockerignore
        # keeps node_modules/.venv/Cal_TS_Frontend out -- see note below).
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ steps.build-image.outputs.image }}

# ----------------------------------------------------------------------------
# Confirm your root .dockerignore excludes at least:
#   node_modules
#   .venv
#   .git
#   Cal_TS_Frontend
#   dist
#   *.md
# Otherwise the whole repo (including the frontend + node_modules) gets sent as
# build context, making the image slow to build and unnecessarily large.
#
# Also confirm the COPY lines inside your Dockerfile point at the right place
# now that it builds from root (e.g. `COPY Cal_Backend/ ./` or `COPY . .`).
# ----------------------------------------------------------------------------