name: Deploy frontend to AWS
on:
  push:
    branches: [master]
  workflow_dispatch:   # lets you trigger manually from GitHub UI

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: calendar-by-kla-frontend-099210689603
  CLOUDFRONT_DISTRIBUTION_ID: ER7EG11FK6I0V

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Install
        run: npm ci
      
      - name: Build
        env:
          VITE_API_BASE_URL: https://dtdjg3wim5ilk.cloudfront.net
        run: npm run build
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::099210689603:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete
      
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      
      - name: Smoke test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dtdjg3wim5ilk.cloudfront.net/)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Site responding"